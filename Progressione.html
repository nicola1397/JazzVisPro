<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jazz Viz Pro - Professional Edition</title>
    <style>
      :root {
        --bg: #1a1a1a;
        --panel: #2c3e50;
        --accent: #f1c40f;
        --wood: #3d2b1f;
        --text: #ecf0f1;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
      }

      /* Navbar & Panels */
      .navbar {
        width: 100%;
        background: #121212;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        flex-wrap: wrap;
        box-sizing: border-box;
        border-bottom: 2px solid #2c3e50;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      }
      .logo {
        font-weight: 900;
        color: var(--accent);
        font-size: 1.5em;
        letter-spacing: -1px;
        margin-right: 10px;
      }

      .nav-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .nav-group {
        display: flex;
        flex-direction: column;
      }
      .nav-group label {
        font-size: 0.7em;
        color: #bdc3c7;
        margin-bottom: 2px;
        margin-left: 2px;
      }

      select,
      button {
        font-weight: bold;
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: 0.2s;
      }
      select {
        background: #333;
        color: #eee;
        border: 1px solid #444;
      }
      .btn-snapshot {
        background: #f39c12;
        color: white;
        font-size: 0.9em;
      }
      .btn-reset {
        background: #c0392b;
        color: white;
        font-size: 0.9em;
      }

      .checkbox-group {
        display: flex;
        gap: 10px;
        background: rgba(0, 0, 0, 0.2);
        padding: 4px 10px;
        border-radius: 6px;
        align-self: flex-end;
        height: 34px;
        box-sizing: border-box;
        align-items: center;
      }
      .checkbox-container {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85em;
        cursor: pointer;
      }

      /* Interval Legend */
      .controls {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        margin: 15px 0;
        background: rgba(255, 255, 255, 0.05);
        padding: 10px 20px;
        border-radius: 20px;
        justify-items: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .color-option {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .color-option .label {
        font-size: 0.7em;
        margin-bottom: 4px;
        color: #bdc3c7;
        font-weight: bold;
      }
      .swatch {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid #fff;
      }
      @media (min-width: 1200px) {
        .controls {
          grid-template-columns: repeat(12, 1fr);
        }
      }

      /* Main Fretboard */
      .viewport {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .scroll-wrapper {
        width: 100%;
        overflow-x: auto;
        padding: 20px 0;
        display: flex;
        justify-content: flex-start;
      }

      .scroll-content {
        display: block;
        width: max-content;
        position: relative;
        margin: 0 auto;
      }

      .fretboard-container {
        position: relative;
        background: var(--wood);
        border: 5px solid #111;
        border-radius: 10px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
        margin: 0 auto;
      }
      .string {
        display: flex;
        height: 36px;
        position: relative;
        align-items: center;
      }
      .string::before {
        content: "";
        position: absolute;
        width: 100%;
        background: linear-gradient(to bottom, #777, #bbb, #777);
        z-index: 2;
        pointer-events: none;
      }
      .s1::before {
        height: 1.2px;
      }
      .s2::before {
        height: 1.8px;
      }
      .s3::before {
        height: 2.2px;
      }
      .s4::before {
        height: 3px;
      }
      .s5::before {
        height: 4px;
      }
      .s6::before {
        height: 5.5px;
      }

      .fret {
        width: 45px;
        min-width: 30px;
        height: 100%;
        border-right: 2px solid #666;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .fret-0 {
        border-right: 12px solid #ccc;
        width: 40px;
        min-width: 30px;
        position: sticky;
        left: 0;
        z-index: 50;
        background: var(--wood);
      }

      .note-circle {
        width: 26px;
        height: 26px;
        background: white;
        border: 2px solid #000;
        border-radius: 50%;
        z-index: 10;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 10px;
        font-weight: bold;
        color: transparent;
        transition: all 0.2s ease;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
      }

      /* Note States */
      .active-note {
        color: rgba(0, 0, 0, 0.8) !important;
        opacity: 1;
        transform: scale(1);
        visibility: visible;
        border-color: rgba(0, 0, 0, 0.5);
      }
      /* CAGED Shape Highlight */
      .shape-note {
        box-shadow:
          0 0 0 2px #fff,
          0 0 8px var(--accent);
        z-index: 20;
        border-color: var(--accent) !important;
        font-weight: 900;
        transform: scale(1.1);
      }
      .note-ghost {
        transform: scale(0.5);
        color: transparent !important;
        border-color: transparent;
      }
      .note-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(0.5);
      }

      /* Fret Markers */
      .fret-marker {
        position: absolute;
        width: 16px;
        height: 16px;
        background: #555;
        border-radius: 50%;
        z-index: 1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid #333;
      }

      .fret-numbers {
        display: flex;
        padding-top: 10px;
        margin-bottom: 30px;
      }
      .num {
        width: 47px;
        text-align: center;
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
      }
      .num-0 {
        width: 52px;
        position: sticky;
        left: 0;
        z-index: 51;
        background: var(--bg);
      }

      /* Snapshots area */
      .snapshot-area {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding-bottom: 50px;
        align-items: center;
      }

      .snapshot-card {
        background: var(--panel);
        padding: 15px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 20px;
        border-left: 8px solid var(--accent);
        flex-grow: 1;
        width: 100%;
        transition: opacity 0.2s ease;
      }

      .snapshot-card.dragging {
        opacity: 0.4;
        background: #4a637e;
      }

      .snapshot-meta {
        min-width: 150px;
      }
      .snapshot-meta h3 {
        margin: 0 0 5px 0;
        color: var(--accent);
        font-size: 1.1em;
      }

      .mini-fretboard-wrap {
        width: 100%;
        background: var(--wood);
        border-radius: 6px;
        border: 3px solid #111;
        overflow: hidden;
      }
      .mini-fretboard {
        display: flex;
        flex-direction: column;
        padding: 5px 0;
        width: 100%;
      }
      .mini-string {
        display: flex;
        height: 16px;
        align-items: center;
        position: relative;
      }
      .mini-string::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 1px;
        background: #888;
        z-index: 1;
      }
      .mini-fret {
        flex: 1;
        height: 100%;
        border-right: 1px solid #555;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .mini-circle {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        z-index: 2;
        border: 1px solid #000;
      }
      .mini-num-row {
        display: flex;
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
      }
      .mini-num {
        flex: 1;
        text-align: center;
        font-size: 8px;
        color: #bdc3c7;
        padding: 2px 0;
      }

      /* Mobile Navigation */
      .navbar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .nav-menu {
        display: flex;
        flex-grow: 1;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
      }
      .nav-actions {
        display: flex;
        gap: 10px;
      }
      .nav-toggle {
        display: none;
        background: transparent;
        border: 1px solid #444;
        color: var(--accent);
        font-size: 1.2rem;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
      }

      @media (max-width: 1024px) {
        .navbar {
          flex-direction: column;
          align-items: stretch;
          padding: 10px 15px;
        }
        .navbar-header {
          width: 100%;
        }
        .nav-toggle {
          display: block;
        }
        .nav-menu {
          display: none;
          flex-direction: column;
          width: 100%;
          margin-top: 15px;
          gap: 15px;
          border-top: 1px solid #333;
          padding-top: 15px;
        }
        .nav-menu.active {
          display: flex;
        }
        .nav-controls {
          flex-direction: column;
          align-items: stretch;
          width: 100%;
        }
        .nav-group select {
          width: 100%;
        }
        .nav-actions {
          width: 100%;
        }
        .nav-actions button {
          flex: 1;
        }
        .checkbox-group {
          width: 100%;
          justify-content: space-between;
        }

        /* Mobile Snapshots */
        .snapshot-card {
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
        }

        .snapshot-meta {
          width: 100%;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .snapshot-meta h3 {
          margin: 0;
          font-size: 1.1em;
        }
        .snapshot-meta p {
          margin: 0 !important;
          text-align: right;
          line-height: 1.2;
        }
        .mini-fretboard-wrap {
          width: 100%;
        }
      }

      /* Progression Player Area */
      .progression-player-area {
        width: 100%;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        padding: 20px;
        margin: 30px 0;
        box-sizing: border-box;
        border: 1px solid #333;
      }
      .area-title {
        margin-top: 0;
        font-size: 1.4em;
        color: var(--accent);
        border-bottom: 1px solid #444;
        padding-bottom: 10px;
        margin-bottom: 15px;
      }
      .progression-steps-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }
      .progression-step {
        display: flex;
        align-items: center;
        gap: 15px;
        background: var(--panel);
        padding: 10px 15px;
        border-radius: 8px;
        flex-wrap: wrap;
        transition: box-shadow 0.3s ease;
      }
      .progression-step.active-step {
        box-shadow: 0 0 0 3px var(--accent);
      }
      .progression-step .step-label {
        font-size: 0.9em;
        font-weight: bold;
        color: #bdc3c7;
        min-width: 50px;
      }
      .progression-step select {
        flex-grow: 1;
      }
      .progression-step .prog-duration-input {
        width: 60px;
        padding: 8px 12px;
        box-sizing: border-box;
        background: #333;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
      }
      .progression-step .bars-label {
        font-size: 0.8em;
        color: #bdc3c7;
      }
      .btn-remove-step {
        background: #c0392b;
        color: white;
        border: none;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        cursor: pointer;
        margin-left: auto;
        font-weight: bold;
        font-size: 1.2em;
        line-height: 28px;
        padding: 0;
      }
      .progression-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        border-top: 1px solid #333;
        padding-top: 15px;
      }
      .player-controls {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }

      .player-controls input[type="number"],
      .player-controls select {
        background: #333;
        color: #eee;
        border: 1px solid #444;
        padding: 8px 12px;
        border-radius: 6px;
        width: 70px;
        font-weight: bold;
      }
      .btn-add-step {
        background: #27ae60;
        color: white;
      }
      .btn-play {
        background: #2980b9;
        color: white;
        width: 80px;
      }
      .btn-stop {
        background: #7f8c8d;
        color: white;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-header">
        <div class="logo">JAZZ<span>VIZ</span> PRO</div>
        <button class="nav-toggle" onclick="toggleMenu()">☰</button>
      </div>

      <div class="nav-menu" id="navMenu">
        <div class="nav-controls">
          <div class="nav-group">
            <label>Tuning</label>
            <select
              id="tuning-select"
              onchange="
                renderFretboard();
                applyFullScale();
              "
            ></select>
          </div>
          <div class="nav-group">
            <label>Key</label>
            <select id="root-select" onchange="applyFullScale()"></select>
          </div>
          <div class="nav-group">
            <label>Scale</label>
            <select id="scale-select" onchange="applyFullScale()"></select>
          </div>
          <div class="nav-group">
            <label>Notation</label>
            <select id="notation-select" onchange="applyFullScale()">
              <option value="interval">Intervals</option>
              <option value="note">Notes</option>
            </select>
          </div>
          <div class="nav-group">
            <label>Accidentals</label>
            <select id="accidental-select" onchange="applyFullScale()">
              <option value="#">Sharp (#)</option>
              <option value="b">Flat (b)</option>
            </select>
          </div>
          <div class="nav-group">
            <label>CAGED</label>
            <select id="caged-select" onchange="applyFullScale()">
              <option value="none">None</option>
              <option value="C">C Shape</option>
              <option value="A">A Shape</option>
              <option value="G">G Shape</option>
              <option value="E">E Shape</option>
              <option value="D">D Shape</option>
            </select>
          </div>
          <div class="checkbox-group">
            <div class="checkbox-container">
              <input
                type="checkbox"
                id="hide-unused"
                onchange="applyFullScale()"
              />
              <label for="hide-unused">Filtra</label>
            </div>
            <div class="checkbox-container">
              <input
                type="checkbox"
                id="solo-arpeggio"
                onchange="applyFullScale()"
              />
              <label for="solo-arpeggio" style="color: var(--accent)"
                >1-3-5-7</label
              >
            </div>
          </div>
          <div class="checkbox-group">
            <div class="checkbox-container">
              <input type="checkbox" id="add-4" onchange="applyFullScale()" />
              <label for="add-4">Add 4th</label>
            </div>
            <div class="checkbox-container">
              <input type="checkbox" id="add-6" onchange="applyFullScale()" />
              <label for="add-6">Add 6th</label>
            </div>
          </div>
        </div>

        <div class="nav-actions">
          <button class="btn-snapshot" onclick="createSnapshot()">
            Snapshot
          </button>
          <button class="btn-reset" onclick="resetFretboard()">Reset</button>
        </div>
      </div>
    </nav>

    <div class="controls" id="legend"></div>

    <div class="viewport">
      <div class="scroll-wrapper">
        <div class="scroll-content">
          <div class="fretboard-container">
            <div id="fretboard-layer"></div>
            <div id="markers-layer"></div>
          </div>
          <div class="fret-numbers" id="numbers-layer"></div>
        </div>
      </div>

      <!-- Progression Player Area -->
      <div class="progression-player-area">
        <h2 class="area-title">Play Along Mode</h2>
        <div id="progression-steps" class="progression-steps-container">
          <!-- Steps will be added here dynamically -->
        </div>
        <div class="progression-controls">
          <button class="btn-add-step" onclick="addProgressionStep()">
            + Add Step
          </button>
          <div class="player-controls">
            <div class="nav-group">
              <label for="bpm-input">BPM</label>
              <input
                type="number"
                id="bpm-input"
                value="120"
                min="40"
                max="300"
              />
            </div>
            <div class="nav-group">
              <label for="beats-per-bar-input">Beats/Bar</label>
              <input
                type="number"
                id="beats-per-bar-input"
                value="4"
                min="1"
                max="8"
              />
            </div>
            <div class="nav-group">
              <label for="metronome-toggle">Click</label>
              <input
                type="checkbox"
                id="metronome-toggle"
                style="margin-top: 10px"
              />
            </div>
            <button
              id="play-pause-btn"
              class="btn-play"
              onclick="togglePlayProgression()"
            >
              Play
            </button>
            <button class="btn-stop" onclick="stopProgression()">Stop</button>
          </div>
        </div>
      </div>

      <div class="snapshot-area" id="snapshot-list"></div>
    </div>

    <script>
      let progressionTimerId = null;
      let audioCtx = null;
      let nextNoteTime = 0.0;
      let stepBeatsRemaining = 0;
      let currentBeatInBar = 0;
      let currentProgressionStep = 0;
      let isPlaying = false;

      const notes = [
        "C",
        "C#",
        "D",
        "D#",
        "E",
        "F",
        "F#",
        "G",
        "G#",
        "A",
        "A#",
        "B",
      ];
      const tunings = {
        "E Standard": [4, 11, 7, 2, 9, 4],
        "Drop D": [4, 11, 7, 2, 9, 2],
        "Eb Standard": [3, 10, 6, 1, 8, 3],
        "D Standard": [2, 9, 5, 0, 7, 2],
        DADGAD: [2, 9, 7, 2, 9, 2],
      };

      const scales = {
        "Ionio (Maj7)": [0, 2, 4, 5, 7, 9, 11],
        "Dorico (m7)": [0, 2, 3, 5, 7, 9, 10],
        "Misolidio (7)": [0, 2, 4, 5, 7, 9, 10],
        "Lidio (Maj7#11)": [0, 2, 4, 6, 7, 9, 11],
        "Altered (7alt)": [0, 1, 3, 4, 6, 8, 10],
        "Minore Melodica": [0, 2, 3, 5, 7, 9, 11],
        "Diminuita (T/S)": [0, 2, 3, 5, 6, 8, 9, 11],
        Esatonale: [0, 2, 4, 6, 8, 10],
        "Minore Pentatonica": [0, 3, 5, 7, 10],
        "Maggiore Pentatonica": [0, 2, 4, 7, 9],
        Blues: [0, 3, 5, 6, 7, 10],
        "Minore Naturale (Aeolian)": [0, 2, 3, 5, 7, 8, 10],
        "Minore Armonica": [0, 2, 3, 5, 7, 8, 11],
        "Lidio Dominante": [0, 2, 4, 6, 7, 9, 10],
        "Misolidio b13": [0, 2, 4, 5, 7, 8, 10],
      };

      const cagedShapes = {
        C: [
          { s: 4, f: 0 },
          { s: 3, f: -1 },
          { s: 2, f: -3 },
          { s: 1, f: -2 },
          { s: 0, f: -3 },
        ],
        A: [
          { s: 4, f: 0 },
          { s: 3, f: 2 },
          { s: 2, f: 2 },
          { s: 1, f: 2 },
          { s: 0, f: 0 },
        ],
        G: [
          { s: 5, f: 0 },
          { s: 4, f: -1 },
          { s: 3, f: -3 },
          { s: 2, f: -3 },
          { s: 1, f: -3 },
          { s: 0, f: 0 },
        ],
        E: [
          { s: 5, f: 0 },
          { s: 4, f: 2 },
          { s: 3, f: 2 },
          { s: 2, f: 1 },
          { s: 1, f: 0 },
          { s: 0, f: 0 },
        ],
        D: [
          { s: 3, f: 0 },
          { s: 2, f: 2 },
          { s: 1, f: 3 },
          { s: 0, f: 2 },
        ],
      };

      const noteNamesFlat = [
        "C",
        "Db",
        "D",
        "Eb",
        "E",
        "F",
        "Gb",
        "G",
        "Ab",
        "A",
        "Bb",
        "B",
      ];

      const intervalColors = {
        0: { label: "Root", color: "#e74c3c", short: "R" },
        1: { label: "b9", color: "#2980b9", short: "b9" },
        2: { label: "9", color: "#3498db", short: "9" },
        3: { label: "b3", color: "#f1c40f", short: "b3" },
        4: { label: "3", color: "#f39c12", short: "3" },
        5: { label: "11", color: "#9b59b6", short: "11" },
        6: { label: "#11", color: "#8e44ad", short: "#11" },
        7: { label: "5", color: "#bdc3c7", short: "5" },
        8: { label: "#5", color: "#95a5a6", short: "#5" },
        9: { label: "13", color: "#1abc9c", short: "13" },
        10: { label: "7", color: "#2ecc71", short: "7" },
        11: { label: "maj7", color: "#27ae60", short: "maj7" },
      };

      function init() {
        const ts = document.getElementById("tuning-select");
        for (let t in tunings) ts.add(new Option(t, t));

        const rs = document.getElementById("root-select");
        notes.forEach((n) => rs.add(new Option(n, n)));
        const ss = document.getElementById("scale-select");
        for (let s in scales) ss.add(new Option(s, s));

        const legend = document.getElementById("legend");
        Object.keys(intervalColors).forEach((int) => {
          legend.innerHTML += `
                    <div class="color-option">
                        <span class="label">${intervalColors[int].short}</span>
                        <div class="swatch" style="background:${intervalColors[int].color}"></div>
                    </div>`;
        });
        renderFretboard();

        // --- Drag and Drop for Snapshots ---
        const snapshotList = document.getElementById("snapshot-list");
        let draggedItem = null;

        snapshotList.addEventListener("dragstart", (e) => {
          if (e.target.classList.contains("snapshot-card")) {
            draggedItem = e.target;
            setTimeout(() => {
              e.target.classList.add("dragging");
            }, 0);
          }
        });

        snapshotList.addEventListener("dragend", () => {
          if (draggedItem) {
            draggedItem.classList.remove("dragging");
            draggedItem = null;
          }
        });

        snapshotList.addEventListener("dragover", (e) => {
          e.preventDefault();
          const afterElement = getDragAfterElement(snapshotList, e.clientY);
          if (draggedItem) {
            if (afterElement == null) {
              snapshotList.appendChild(draggedItem);
            } else {
              snapshotList.insertBefore(draggedItem, afterElement);
            }
          }
        });

        applyFullScale();
        loadLocalData();
      }

      function renderFretboard() {
        const board = document.getElementById("fretboard-layer");
        const nums = document.getElementById("numbers-layer");
        const tuningName =
          document.getElementById("tuning-select").value || "E Standard";
        const tuning = tunings[tuningName];

        board.innerHTML = "";
        nums.innerHTML = "";

        for (let s = 0; s < 6; s++) {
          const str = document.createElement("div");
          str.className = `string s${s + 1}`;
          for (let f = 0; f <= 24; f++) {
            const fret = document.createElement("div");
            fret.className = `fret fret-${f}`;
            // Draw string segment inside fret for sticky behavior
            const strSegment = document.createElement("div");
            strSegment.style.position = "absolute";
            strSegment.style.width = "100%";
            strSegment.style.height = "100%";
            // String style logic moved to CSS pseudo-elements,
            // but we need the specific height classes to apply to the fret context if we change approach.
            // Current CSS uses .string::before. We need .fret::before for sticky.
            // Retaining structure but relying on updated CSS if applied or existing CSS.
            // Since context CSS uses .string::before, let's stick to the CSS change in the <style> block
            // or strictly follow provided context.
            // The context CSS provided still has .string::before.
            // To fix sticky string issue without changing CSS significantly:
            // The sticky nut hides strings unless we draw them inside.
            // *Applying CSS patch for .fret::before via Style injection below*

            const circle = document.createElement("div");
            circle.className = "note-circle";
            circle.dataset.noteIndex = (tuning[s] + f) % 12;
            fret.appendChild(circle);

            // Render Markers inside frets for responsive scaling
            // Single markers on String 4 (index 3), Double markers split between String 2 (index 1) and 5 (index 4)
            const singleMarkers = [3, 5, 7, 9, 15, 17, 19, 21];
            if (s === 3 && singleMarkers.includes(f)) {
              fret.innerHTML += `<div class="fret-marker"></div>`;
            }
            if ((f === 12 || f === 24) && (s === 1 || s === 4)) {
              fret.innerHTML += `<div class="fret-marker"></div>`;
            }

            str.appendChild(fret);
          }
          board.appendChild(str);
        }

        for (let f = 0; f <= 24; f++)
          nums.innerHTML += `<div class="num ${f === 0 ? "num-0" : ""}">${f}</div>`;
      }

      function applyFullScale() {
        const rootIdx = notes.indexOf(
          document.getElementById("root-select").value,
        );
        const scale = scales[document.getElementById("scale-select").value];
        const hideUnused = document.getElementById("hide-unused").checked;
        const soloArp = document.getElementById("solo-arpeggio").checked;
        const add4 = document.getElementById("add-4").checked;
        const add6 = document.getElementById("add-6").checked;
        const notation = document.getElementById("notation-select").value;
        const accidental = document.getElementById("accidental-select").value;
        const cagedShape = document.getElementById("caged-select").value;

        const arpIntervals = [0, 3, 4, 7, 10, 11];
        const tuningName = document.getElementById("tuning-select").value;
        const tuning = tunings[tuningName];
        const currentNotes = accidental === "#" ? notes : noteNamesFlat;

        // Calculate CAGED highlights
        const highlightSet = new Set();
        if (cagedShape !== "none") {
          const shapeDef = cagedShapes[cagedShape];
          const anchorString = shapeDef[0].s; // Root string index
          // Iterate frets to find Root anchors
          for (let f = 0; f <= 24; f++) {
            if ((tuning[anchorString] + f) % 12 === rootIdx) {
              shapeDef.forEach((offset) => {
                // Check bounds
                if (f + offset.f >= 0 && f + offset.f <= 24) {
                  highlightSet.add(`${offset.s}-${f + offset.f}`);
                }
              });
            }
          }
        }

        document.querySelectorAll(".note-circle").forEach((c) => {
          const noteIndex = parseInt(c.dataset.noteIndex);
          const interval = (noteIndex - rootIdx + 12) % 12;
          const inScale = scale.includes(interval);
          const inArp =
            inScale &&
            (arpIntervals.includes(interval) ||
              (add4 && interval === 5) ||
              (add6 && interval === 9));

          // Identify string and fret from DOM for CAGED check
          // This assumes structure: .string > .fret > .note-circle
          // We can infer string index from parent class .sX
          const stringDiv = c.closest(".string");
          const fretDiv = c.closest(".fret");
          // Extract string number (1-6) -> index 0-5
          let sIndex = -1,
            fIndex = -1;
          if (stringDiv && fretDiv) {
            sIndex = parseInt(stringDiv.className.match(/s(\d)/)[1]) - 1;
            fIndex = parseInt(fretDiv.className.match(/fret-(\d+)/)[1]);
          }

          c.classList.remove(
            "active-note",
            "note-ghost",
            "note-hidden",
            "shape-note",
          );
          c.innerText = "";

          if (inScale) {
            const data = intervalColors[interval];
            c.style.backgroundColor = data.color;

            const text =
              notation === "interval" ? data.short : currentNotes[noteIndex];

            if (soloArp) {
              if (inArp) {
                c.classList.add("active-note");
                c.innerText = text;
              } else {
                // Se non è nell'arpeggio ma Filtra Scale è attivo, nascondi del tutto
                if (hideUnused) c.classList.add("note-hidden");
                else c.classList.add("note-ghost");
              }
            } else {
              c.classList.add("active-note");
              c.innerText = text;
            }

            // Apply CAGED highlight
            if (sIndex !== -1 && highlightSet.has(`${sIndex}-${fIndex}`)) {
              c.classList.add("shape-note");
              c.classList.remove("note-ghost"); // Ensure shape notes are visible
              c.classList.add("active-note");
              c.style.opacity = "1";
            }
          } else {
            c.classList.add("note-hidden");
          }
        });
      }

      function createSnapshot(data = null) {
        // If data is passed (loading from storage), use it. Otherwise read UI.
        const root = data
          ? data.root
          : document.getElementById("root-select").value;
        const scaleName = data
          ? data.scale
          : document.getElementById("scale-select").value;
        const tuningName = data
          ? data.tuning
          : document.getElementById("tuning-select").value;
        const soloArp = data
          ? data.soloArp
          : document.getElementById("solo-arpeggio").checked;
        const hideUnused = data
          ? data.hideUnused
          : document.getElementById("hide-unused").checked;
        const add4 = data
          ? data.add4
          : document.getElementById("add-4").checked;
        const add6 = data
          ? data.add6
          : document.getElementById("add-6").checked;

        const rootIdx = notes.indexOf(root);
        const scale = scales[scaleName];
        const tuning = tunings[tuningName];

        const snapshotData = {
          root,
          scale: scaleName,
          tuning: tuningName,
          soloArp,
          hideUnused,
          add4,
          add6,
        };

        const card = document.createElement("div");
        card.className = "snapshot-card";
        card.dataset.snapshot = JSON.stringify(snapshotData);
        card.setAttribute("draggable", "true");

        let rows = "";
        for (let s = 0; s < 6; s++) {
          rows += `<div class="mini-string">`;
          for (let f = 0; f <= 24; f++) {
            const interval = (((tuning[s] + f) % 12) - rootIdx + 12) % 12;
            let visible = scale.includes(interval);

            // Logica visibilità fedele ai filtri attivi
            if (soloArp && ![0, 3, 4, 7, 10, 11].includes(interval)) {
              if (add4 && interval === 5) {
                /* keep visible */
              } else if (add6 && interval === 9) {
                /* keep visible */
              } else if (hideUnused) visible = false;
            }

            rows += `<div class="mini-fret">`;
            if (visible) {
              const color = intervalColors[interval].color;
              const isArp =
                [0, 3, 4, 7, 10, 11].includes(interval) ||
                (add4 && interval === 5) ||
                (add6 && interval === 9);
              // Effetto ghost anche nel mini
              const opac = soloArp && !isArp ? "0.3" : "1";
              rows += `<div class="mini-circle" style="background:${color}; opacity:${opac}"></div>`;
            }
            rows += `</div>`;
          }
          rows += `</div>`;
        }

        // Aggiunta riga numeri tasti mini
        let numRow = `<div class="mini-num-row">`;
        for (let f = 0; f <= 24; f++)
          numRow += `<div class="mini-num">${f}</div>`;
        numRow += `</div>`;

        card.innerHTML = `
                <div class="snapshot-meta">
                    <h3>${root} ${scaleName.split(" ")[0]}</h3>
                    <p style="font-size: 10px; color: #aaa; margin: 0 0 10px 0;">
                        ${soloArp ? "Arpeggio" : "Full Scale"}<br>
                        ${hideUnused ? "Filtro ON" : "Filtro OFF"}
                    </p>
                    <button class="btn-reset" style="padding:4px 8px; font-size:10px" onclick="this.closest('.snapshot-card').remove(); saveLocalData();">Elimina</button>
                </div>
                <div class="mini-fretboard-wrap">
                    <div class="mini-fretboard">${rows}${numRow}</div>
                </div>`;

        if (data) document.getElementById("snapshot-list").appendChild(card);
        else document.getElementById("snapshot-list").prepend(card);

        if (!data) saveLocalData();
      }

      function resetFretboard() {
        document.getElementById("hide-unused").checked = false;
        document.getElementById("solo-arpeggio").checked = false;
        applyFullScale();
      }

      function getDragAfterElement(container, y) {
        const draggableElements = [
          ...container.querySelectorAll(".snapshot-card:not(.dragging)"),
        ];

        return draggableElements.reduce(
          (closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
              return { offset: offset, element: child };
            } else {
              return closest;
            }
          },
          { offset: Number.NEGATIVE_INFINITY },
        ).element;
      }

      // Hook save on drag end
      document
        .getElementById("snapshot-list")
        .addEventListener("dragend", () => {
          setTimeout(saveLocalData, 100);
        });

      // --- Progression Player Functions ---

      function addProgressionStep(data = null) {
        const stepsContainer = document.getElementById("progression-steps");
        const stepIndex = stepsContainer.children.length;
        const stepDiv = document.createElement("div");
        stepDiv.className = "progression-step";
        stepDiv.dataset.index = stepIndex;

        const rootSelectHTML = document
          .getElementById("root-select")
          .outerHTML.replace('id="root-select"', "")
          .replace(/onchange=".*?"/g, "");
        const scaleSelectHTML = document
          .getElementById("scale-select")
          .outerHTML.replace('id="scale-select"', "")
          .replace(/onchange=".*?"/g, "");

        stepDiv.innerHTML = `
            <span class="step-label">Step ${stepIndex + 1}</span>
            ${rootSelectHTML}
            ${scaleSelectHTML}
            <input type="number" class="prog-duration-input" value="${data ? data.bars : 4}" min="1" title="Duration in bars">
            <span class="bars-label">bars</span>
            <button class="btn-remove-step" onclick="this.closest('.progression-step').remove(); updateProgressionIndices(); saveLocalData();" title="Remove Step">×</button>
        `;

        if (data) {
          stepDiv.querySelector("select:nth-of-type(1)").value = data.root;
          stepDiv.querySelector("select:nth-of-type(2)").value = data.scale;
        }

        stepDiv
          .querySelectorAll("select, input")
          .forEach((el) => el.addEventListener("change", saveLocalData));

        stepsContainer.appendChild(stepDiv);
        if (!data) saveLocalData();
      }

      function updateProgressionIndices() {
        const stepsContainer = document.getElementById("progression-steps");
        Array.from(stepsContainer.children).forEach((step, index) => {
          step.dataset.index = index;
          step.querySelector(".step-label").textContent = `Step ${index + 1}`;
        });
      }

      function togglePlayProgression() {
        const playBtn = document.getElementById("play-pause-btn");
        if (isPlaying) {
          isPlaying = false;
          if (audioCtx) audioCtx.suspend();
          playBtn.textContent = "Play";
          document
            .querySelectorAll(".progression-step.active-step")
            .forEach((el) => el.classList.remove("active-step"));
        } else {
          const steps = document.querySelectorAll(".progression-step");
          if (steps.length === 0) {
            alert("Please add at least one step to the progression.");
            return;
          }

          if (!audioCtx)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioCtx.resume();

          isPlaying = true;
          playBtn.textContent = "Pause";
          currentProgressionStep = 0;
          stepBeatsRemaining = 0;
          currentBeatInBar = 0;
          nextNoteTime = audioCtx.currentTime;

          scheduler();
        }
      }

      function stopProgression() {
        const playBtn = document.getElementById("play-pause-btn");
        isPlaying = false;
        playBtn.textContent = "Play";
        currentProgressionStep = 0;
        document
          .querySelectorAll(".progression-step.active-step")
          .forEach((el) => el.classList.remove("active-step"));
      }

      function scheduler() {
        if (!isPlaying) return;

        const lookahead = 0.1;
        const bpm = parseInt(document.getElementById("bpm-input").value) || 120;

        while (nextNoteTime < audioCtx.currentTime + lookahead) {
          runBeat(nextNoteTime);
          nextNoteTime += 60.0 / bpm;
        }

        requestAnimationFrame(scheduler);
      }

      function runBeat(time) {
        const steps = Array.from(
          document.querySelectorAll(".progression-step"),
        );

        // Advance Step Logic
        if (stepBeatsRemaining <= 0) {
          if (currentProgressionStep >= steps.length)
            currentProgressionStep = 0;

          document
            .querySelectorAll(".progression-step.active-step")
            .forEach((el) => el.classList.remove("active-step"));
          const currentStepEl = steps[currentProgressionStep];
          currentStepEl.classList.add("active-step");

          document.getElementById("root-select").value =
            currentStepEl.querySelector("select:nth-of-type(1)").value;
          document.getElementById("scale-select").value =
            currentStepEl.querySelector("select:nth-of-type(2)").value;
          applyFullScale();

          const durationBars =
            parseInt(
              currentStepEl.querySelector(".prog-duration-input").value,
            ) || 4;
          const beatsPerBar =
            parseInt(document.getElementById("beats-per-bar-input").value) || 4;
          stepBeatsRemaining = durationBars * beatsPerBar;

          currentProgressionStep++;
        }

        // Play Click
        const beatsPerBar =
          parseInt(document.getElementById("beats-per-bar-input").value) || 4;
        const isDownbeat = currentBeatInBar === 0;

        if (document.getElementById("metronome-toggle").checked) {
          playClick(time, isDownbeat);
        }

        stepBeatsRemaining--;
        currentBeatInBar = (currentBeatInBar + 1) % beatsPerBar;
      }

      function playClick(time, isDownbeat) {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.frequency.value = isDownbeat ? 1000 : 800;
        gainNode.gain.value = 0.1;
        osc.start(time);
        osc.stop(time + 0.05);
      }

      // --- Local Storage ---
      function saveLocalData() {
        const snapshots = [];
        document.querySelectorAll(".snapshot-card").forEach((card) => {
          if (card.dataset.snapshot)
            snapshots.push(JSON.parse(card.dataset.snapshot));
        });
        const progression = [];
        document.querySelectorAll(".progression-step").forEach((step) => {
          progression.push({
            root: step.querySelector("select:nth-of-type(1)").value,
            scale: step.querySelector("select:nth-of-type(2)").value,
            bars: step.querySelector(".prog-duration-input").value,
          });
        });
        localStorage.setItem("jazzVizSnapshots", JSON.stringify(snapshots));
        localStorage.setItem("jazzVizProgression", JSON.stringify(progression));
      }

      function loadLocalData() {
        const snaps = JSON.parse(localStorage.getItem("jazzVizSnapshots"));
        if (snaps && Array.isArray(snaps))
          snaps.forEach((data) => createSnapshot(data));

        const prog = JSON.parse(localStorage.getItem("jazzVizProgression"));
        if (prog && Array.isArray(prog))
          prog.forEach((data) => addProgressionStep(data));
      }

      function toggleMenu() {
        document.getElementById("navMenu").classList.toggle("active");
      }

      init();
    </script>
  </body>
</html>
